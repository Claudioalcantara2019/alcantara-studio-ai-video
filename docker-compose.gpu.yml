services:
  alcantara-gpu-worker:
    build:
      context: ./gpu-worker
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3.10", "-c", "import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/ready\", timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    environment:
      MUSETALK_DIR: /opt/MuseTalk
      GPU_CONCURRENCY: "1"
      MAX_VIDEO_DURATION_SECONDS: "900"
      MAX_UPLOAD_BYTES: "2147483648"
      MUSETALK_BATCH_SIZE: "4"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      MAX_JOB_AGE_HOURS: "72"
    volumes:
      - musetalk-models:/opt/MuseTalk/models
      - alcantara-jobs:/data/jobs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  musetalk-models:
  alcantara-jobs:
