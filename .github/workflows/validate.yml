name: Validate

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile GPU worker
        run: python -m py_compile gpu-worker/main.py gpu-worker/musetalk_runner.py
      - name: Verify key worker endpoints exist
        run: |
          grep -q '@app.post("/generate")' gpu-worker/main.py
          grep -q '@app.get("/ready")' gpu-worker/main.py
          grep -q '@app.get("/gpu")' gpu-worker/main.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js application
        run: npm run build
