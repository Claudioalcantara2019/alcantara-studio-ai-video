name: Validate

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile GPU worker
        run: python -m py_compile gpu-worker/main.py gpu-worker/musetalk_runner.py
      - name: Verify key worker contracts
        run: |
          grep -q '@app.post("/generate")' gpu-worker/main.py
          grep -q '@app.get("/ready")' gpu-worker/main.py
          grep -q '@app.get("/gpu")' gpu-worker/main.py
          grep -q 'VIDEO_SHORTER_THAN_AUDIO' gpu-worker/main.py
          grep -q 'MAX_JOB_AGE_HOURS' gpu-worker/main.py
          grep -q '"performance"' gpu-worker/main.py
          grep -q '"cancelled"' gpu-worker/main.py
          grep -q '@app.delete("/jobs/{job_id}")' gpu-worker/main.py
          grep -q 'GPU_BACKEND_NOT_READY' app/api/jobs/route.ts
          grep -q '"-map", "1:a:0"' gpu-worker/main.py
          grep -q 'workdir / job\["audio_filename"\]' gpu-worker/main.py

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows scripts
        shell: pwsh
        run: |
          $scripts = @(
            "scripts/windows/check-gpu.ps1",
            "scripts/windows/start-gpu-worker.ps1",
            "scripts/windows/start-web.ps1",
            "scripts/windows/show-job.ps1",
            "scripts/windows/validate-project.ps1",
            "scripts/windows/go-nvidia.ps1",
            "scripts/windows/start-all.ps1",
            "scripts/windows/status.ps1",
            "scripts/windows/stop-all.ps1",
            "scripts/windows/test-pipeline.ps1"
          )

          foreach ($script in $scripts) {
            if (-not (Test-Path $script)) {
              throw "Missing script: $script"
            }

            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$null,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              throw "PowerShell syntax error in $script"
            }
          }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Build Next.js application
        run: npm run build

